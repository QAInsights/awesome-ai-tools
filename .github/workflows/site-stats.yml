name: Generate Site Stats

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-stats
  cancel-in-progress: false

jobs:
  generate-site-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate site stats
        env:
          CF_ACCOUNT_ID: 79a56f7656f972b064b9d4ec3662b8d0
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/generate-site-stats.ts

      - name: Commit and push stats
        run: |
          set -euo pipefail
          if git diff --quiet -- public/data/site-stats.json; then
            echo "No stats changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/site-stats.json
          git commit -m "chore(stats): refresh site stats"
          git push origin HEAD:main
