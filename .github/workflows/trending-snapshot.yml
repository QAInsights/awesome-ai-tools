name: Weekly Trending Snapshot

on:
  schedule:
    # Mondays, after the ISO week (Mon-Sun UTC) closes and before the 02:00 UTC deploy
    - cron: '15 0 * * 1'
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO week to (re)build, e.g. 2026-w40. Defaults to the last completed week.'
        required: false

permissions:
  contents: write

concurrency:
  group: trending-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history: "New this week" diffs data/slugs.json across the week
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate snapshot
        env:
          CF_ACCOUNT_ID: 79a56f7656f972b064b9d4ec3662b8d0
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEK: ${{ inputs.week }}
        run: |
          if [ -n "${WEEK:-}" ]; then
            bun scripts/generate-trending-snapshot.ts --week "$WEEK" --force
          else
            bun scripts/generate-trending-snapshot.ts
          fi

      - name: Commit and push snapshot
        run: |
          set -euo pipefail
          if git diff --quiet -- data/trending; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trending
          git commit -m "chore(trending): weekly snapshot"
          git push origin HEAD:main
